name: build-dmg

on:
  # Manual trigger for on-demand builds.
  workflow_dispatch:
  # release.yml builds the DMG it publishes through this workflow, so tag
  # builds run on the same runner and steps as every other build.
  workflow_call:
  # Every merge to main, so hidden-import gaps in the frozen backend surface
  # long before release day.
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/build-dmg.yml'
      - 'desktop/**'
      - 'scripts/build-python-backend.sh'
      - 'scripts/smoke-test-python-backend.sh'
      - 'scripts/pyinstaller/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  # Literal prefix: inside a reusable workflow `github.workflow` is the
  # caller's name, and sharing a group with the caller deadlocks the run.
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Require an Apple Silicon runner
        # The DMG targets arm64 only, and PyInstaller freezes for the host
        # architecture, so an Intel runner would ship an x86_64 backend.
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Expected an arm64 runner, got $(uname -m)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No cache on tag builds, so a release never restores a cache
          # written by another ref.
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - name: Freeze Python backend (PyInstaller)
        env:
          REVISICA_BUILD_PY: python3.12
        run: bash scripts/build-python-backend.sh

      - name: Smoke-test frozen backend
        run: bash scripts/smoke-test-python-backend.sh

      - name: Build Electron DMG (ad-hoc signed)
        working-directory: desktop
        # No Developer ID yet: electron-builder skips signing, and the
        # afterPack hook (build/adhoc-sign-mac-app.cjs) ad-hoc signs the app
        # so the bundle stays valid. For real signing + notarization, add
        # CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
        # / APPLE_TEAM_ID as secrets, drop this variable, and set
        # `notarize: true` in electron-builder.yml.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Puppeteer is a dev dependency for screenshots; the build does not
          # need its bundled Chrome.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm run build:mac

      - name: Recompress the DMG with LZMA
        # electron-builder 25 only offers zlib / lzfse / bzip2. LZMA (ULMO,
        # macOS 10.15+) took a local build from 209 MB to 161 MB; the app is
        # arm64-only and needs macOS 11+ anyway. The blockmap describes the
        # old image and is only used for auto-update, so drop it.
        working-directory: desktop
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' | head -n 1)
          hdiutil convert "$dmg" -format ULMO -o "${dmg%.dmg}-lzma.dmg"
          mv "${dmg%.dmg}-lzma.dmg" "$dmg"
          rm -f "$dmg.blockmap"

      - name: Verify the app inside the DMG
        working-directory: desktop
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' | head -n 1)
          mount_point=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          app="$mount_point/Revisica.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -f "$app/Contents/Resources/LICENSE"
          test -x "$app/Contents/Resources/resources/python-backend/python-backend"

      - name: Verify DMG size budget
        working-directory: desktop
        # docs/specs/dmg-packaging.md targets "< 200 MB". 220 MB is the hard
        # fail — wheel bloat from langchain/langgraph releases can push us
        # over 200 without anything being wrong locally; 220 gives a single
        # release cycle of headroom before we have to prune the spec file.
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' | head -n 1)
          echo "DMG: $dmg"
          size_mb=$(du -m "$dmg" | awk '{print $1}')
          echo "Size: ${size_mb} MB"
          if [[ "$size_mb" -gt 220 ]]; then
            echo "DMG exceeds 220 MB budget — prune hiddenimports or revisit ADR 0002" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Revisica-arm64-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
